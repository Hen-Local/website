name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build and test static site
        run: npm test
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}

      - name: Verify the survey's Mac beta download
        run: |
          url=$(node -p 'require("./app/data/mac-beta.json").url')
          result=$(curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --retry 2 --max-time 30 --location --range 0-15 --max-filesize 65536 \
            --output /dev/null --write-out '%{http_code} %{size_download} %{content_type}' "$url")
          case "$result" in
            "206 16 application/octet-stream"*|"206 16 application/x-apple-diskimage"*) ;;
            *) echo "Expected 16 bytes of the beta disk image, got $result"; exit 1 ;;
          esac

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
