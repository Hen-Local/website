name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build and test static site
        run: npm test
        env:
          NEXT_PUBLIC_MAC_DOWNLOAD_URL: ${{ vars.MAC_DOWNLOAD_URL }}
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}

      - name: Verify the public installer is reachable without signing in
        if: vars.MAC_DOWNLOAD_URL != ''
        env:
          MAC_DOWNLOAD_URL: ${{ vars.MAC_DOWNLOAD_URL }}
        run: |
          case "$MAC_DOWNLOAD_URL" in https://*) ;; *) exit 1 ;; esac
          content_type=$(curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --location --head --output /dev/null --write-out '%{content_type}' "$MAC_DOWNLOAD_URL")
          case "$content_type" in application/octet-stream*|application/x-apple-diskimage*|application/x-diskcopy*) ;; *) echo "Expected a public disk image, got $content_type"; exit 1 ;; esac

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
